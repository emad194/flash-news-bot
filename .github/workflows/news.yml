name: News Publisher

on:
  schedule:
    - cron: '*/10 * * * *'  # تشغيل تلقائي كل 10 دقائق
  workflow_dispatch:        # يتيح التشغيل اليدوي أيضاً

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nostr-sdk requests feedparser beautifulsoup4

      - name: Restore Published History
        uses: actions/cache@v4
        with:
          path: published_posts.txt
          key: published-posts-${{ github.run_id }}
          restore-keys: |
            published-posts-

      - name: Run News Script
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
        run: python news_poster.py
