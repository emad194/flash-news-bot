name: News Publisher

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install telethon nostr-sdk requests

      - name: Restore Published History
        uses: actions/cache@v3
        with:
          path: published_posts.txt
          key: published-posts-${{ github.run_id }}
          restore-keys: |
            published-posts-

      - name: Run News Script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
        run: python news_poster.py
